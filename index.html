function monthLabel(d){ if(!d)return""; const dt=new Date(d); return dt.toLocaleDateString("en-US",{month:"short",year:"numeric"}).replace(" ","-"); }

function calcOEE(g,n){
  const smv=SMV[g.productCriteria]||null;
  const st=parseFloat(g.shiftTime)||480, pd=parseFloat(n.plannedDown)||0;
  const art=st-pd;
  const npt=(parseFloat(n.qco)||0)+(parseFloat(n.unavailOrder)||0)+(parseFloat(n.manpower)||0)+(parseFloat(n.gas)||0)+(parseFloat(n.electricity)||0)+(parseFloat(n.others)||0);
  const runt=art-npt, ao=parseFloat(g.actualOutput)||0, waste=parseFloat(n.totalWastage)||0, good=ao-waste;
  const cap=smv?Math.round(st/smv*10)/10:null;
  const tgt=pd>0&&smv?Math.round((st-pd)/smv*10)/10:cap;
  const av=art>0?runt/art:0, perf=runt>0&&smv?ao*smv/runt:0, qual=ao>0?good/ao:0;
  return{cap,tgt,smv,ach:tgt?ao/tgt*100:null,art,runt,npt,nptPct:art>0?npt/art:0,av,perf,qual,oee:av*perf*qual,good,wastePct:ao>0?waste/ao:0};
}

const P=(v)=>v!=null&&!isNaN(v)?(v*100).toFixed(1)+"%":"—";
const R=(v)=>v!=null&&!isNaN(v)?parseFloat(v).toFixed(1):"—";

function Field({label,children}){
  return(
    <div style={{marginBottom:12}}>
      <label style={{display:"block",fontSize:11,fontWeight:700,color:"#667085",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.05em"}}>{label}</label>
      {children}
    </div>
  );
}

const IS={width:"100%",padding:"8px 10px",fontSize:13,border:"1.5px solid #d0d5dd",borderRadius:7,background:"#fff",color:"#101828",fontFamily:"inherit",outline:"none",transition:"border-color 0.15s"};
const IS_RO={...IS,background:"#f9fafb",cursor:"default",color:"#667085"};

function Sel({value,onChange,options,placeholder}){
  return(
    <select value={value} onChange={e=>onChange(e.target.value)} style={IS}>
      {placeholder&&<option value="">{placeholder}</option>}
      {options.map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  );
}

function Inp({value,onChange,type="text",placeholder="",readOnly=false}){
  return <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} readOnly={readOnly} style={readOnly?IS_RO:IS}/>;
}

function SecHead({children}){
  return <div style={{fontSize:10,fontWeight:800,letterSpacing:"0.12em",textTransform:"uppercase",color:"#98a2b3",margin:"20px 0 10px",borderBottom:"1.5px solid #eaecf0",paddingBottom:5}}>{children}</div>;
}

function OEECard({label,value,accent}){
  return(
    <div style={{background:"#fff",border:"1.5px solid #e4e7ec",borderRadius:8,padding:"10px 12px",textAlign:"center"}}>
      <div style={{fontSize:10,fontWeight:700,color:"#98a2b3",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>{label}</div>
      <div style={{fontSize:22,fontWeight:700,color:accent?"#185FA5":"#101828",letterSpacing:"-0.5px"}}>{value}</div>
    </div>
  );
}

function App(){

  const [loading,setLoading]=useState(false);

  const [g,setG]=useState({date:today,section:"Injection Molding",productCriteria:"",supervisorName:"",shift:"",actualOutput:"",shiftTime:"480",machine:""});
  const [n,setN]=useState({qco:"",unavailOrder:"",manpower:"",gas:"",electricity:"",totalWastage:"",wastageReason:"",others:"",remarks:"",plannedDown:""});

  const uG=(k)=>(v)=>setG(p=>({...p,[k]:v}));
  const uN=(k)=>(v)=>setN(p=>({...p,[k]:v}));

  async function saveProd(){
    if(!g.date||!g.productCriteria||!g.actualOutput||!g.supervisorName||!g.shift){setStatus({t:"err",m:"Please fill all required fields (*)"});return;}
    setLoading(true);setStatus(null);
    const c=oee||{};
    const payload={action:"addProduction",data:{sbu:"ALEL",date:g.date,section:g.section,shift:g.shift,machine:g.machine,productCriteria:g.productCriteria,supervisorName:g.supervisorName,shiftCapacity:c.cap||"",shiftTarget:c.tgt||"",actualOutput:g.actualOutput,idealCycleTime:c.smv||"",achievementPct:c.ach?c.ach/100:"",shiftTime:g.shiftTime,plannedDownTime:n.plannedDown||0,availableRunTime:c.art||"",totalNPT:c.npt||0,actualRunTime:c.runt||"",gas:n.gas||0,electricity:n.electricity||0,unavailOrder:n.unavailOrder||0,rawMaterial:0,manpower:n.manpower||0,qco:n.qco||0,inProcessSetup:0,mechBreakdown:0,elecBreakdown:0,othersDowntime:n.others||0,nptPct:c.nptPct||"",wastagePct:0,totalWastage:n.totalWastage||0,wastagePctCalc:c.wastePct||"",wastageReason:n.wastageReason||"",goodProduction:c.good||"",availability:c.av||"",performance:c.perf||"",quality:c.qual||"",oee:c.oee||"",remarks:n.remarks||"",month:monthLabel(g.date)}};
    try{
      const res=await fetch(APPS_SCRIPT_URL,{method:"POST",body:JSON.stringify(payload),headers:{"Content-Type":"application/json"}});
      const json=await res.json();
      if(json.success){setStatus({t:"ok",m:"✓ Production entry saved to Google Sheet!"});setG(p=>({...p,actualOutput:"",machine:""}));setN({qco:"",unavailOrder:"",manpower:"",gas:"",electricity:"",totalWastage:"",wastageReason:"",others:"",remarks:"",plannedDown:""});}
      else setStatus({t:"err",m:json.error||"Failed to save. Check Apps Script."});
    }catch(e){setStatus({t:"err",m:"Network error — check Apps Script URL and deployment."});}
    setLoading(false);
  }

  async function saveBd(){
    if(!b.date||!b.productCriteria||!b.supervisorName||!b.shift||!b.breakdownType||!b.downtime){setStatus({t:"err",m:"Please fill all required fields (*)"});return;}
    setLoading(true);setStatus(null);
    const payload={action:"addBreakdown",data:{sbu:"Injection",date:b.date,section:b.section,shift:b.shift,machine:b.machine,productCriteria:b.productCriteria,supervisorName:b.supervisorName,breakdownType:b.breakdownType,breakdownName:b.breakdownReason,reason:b.breakdownReason,downtime:b.downtime,remarks:b.remarks,month:monthLabel(b.date).split("-")[0]}};
    try{
      const res=await fetch(APPS_SCRIPT_URL,{method:"POST",body:JSON.stringify(payload),headers:{"Content-Type":"application/json"}});
      const json=await res.json();
      if(json.success){setStatus({t:"ok",m:"✓ Breakdown entry saved to Google Sheet!"});setB(p=>({...p,breakdownType:"",breakdownReason:"",downtime:"",remarks:"",machine:""}));}
      else setStatus({t:"err",m:json.error||"Failed to save."});
    }catch(e){setStatus({t:"err",m:"Network error — check Apps Script URL."});}
    setLoading(false);
  }

  const btnStyle={width:"100%",padding:"10px",fontSize:13,fontWeight:700,borderRadius:7,border:"none",cursor:"pointer",fontFamily:"inherit",letterSpacing:"0.02em",marginTop:4,transition:"opacity 0.15s"};

    <div style={{minHeight:"100vh",background:"#f2f4f7",padding:"24px 16px"}}>
      <div style={{maxWidth:860,margin:"0 auto"}}>

        {/* Header */}

          </div>
          <div style={{background:"#ecfdf3",color:"#027a48",fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:20,border:"1px solid #6ce9a6"}}>LIVE</div>
        </div>

        {/* Tabs */}
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {[["prod","📋  Production Entry"],["bd","🔧  Breakdown Entry"]].map(([k,l])=>(
            <button key={k} onClick={()=>{setTab(k);setStatus(null);}}
              style={{padding:"8px 20px",fontSize:13,fontWeight:700,borderRadius:8,cursor:"pointer",fontFamily:"inherit",
                border:tab===k?"2px solid #185FA5":"1.5px solid #d0d5dd",
                background:tab===k?"#185FA5":"#fff",
                color:tab===k?"#fff":"#667085",
                boxShadow:tab===k?"0 2px 8px rgba(24,95,165,0.15)":"none"}}>
              {l}
            </button>
          ))}
        </div>

        {/* Status */}
        {status&&(
          <div style={{padding:"10px 14px",borderRadius:8,marginBottom:14,fontSize:13,fontWeight:600,
            background:status.t==="ok"?"#ecfdf3":"#fef3f2",
            color:status.t==="ok"?"#027a48":"#b42318",
            border:`1.5px solid ${status.t==="ok"?"#6ce9a6":"#fda29b"}`}}>
            {status.m}
          </div>
        )}

        {/* PRODUCTION FORM */}
        {tab==="prod"&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,alignItems:"start"}}>
            {/* Left: Form */}
            <div style={{background:"#fff",border:"1.5px solid #e4e7ec",borderRadius:12,padding:"18px 20px"}}>

                ))}
              </div>
              <Field label="Wastage Reason"><Inp value={n.wastageReason} onChange={uN("wastageReason")} placeholder="e.g. bad mold"/></Field>
              <Field label="Remarks"><Inp value={n.remarks} onChange={uN("remarks")} placeholder="Optional"/></Field>

              <button onClick={saveProd} disabled={loading} style={{...btnStyle,background:loading?"#84adcf":"#185FA5",color:"#fff",opacity:loading?0.8:1}}>

                  <>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                      <OEECard label="Availability" value={P(oee.av)}/>
                      <OEECard label="Performance" value={P(oee.perf)}/>
                      <OEECard label="Quality" value={P(oee.qual)}/>
                      <OEECard label="OEE" value={P(oee.oee)} accent/>
                    </div>
                    <table style={{width:"100%",fontSize:12,borderCollapse:"collapse"}}>
                      {[
                        ["Shift Capacity",oee.cap?R(oee.cap)+" pcs":"—"],
                        ["Shift Target",oee.tgt?R(oee.tgt)+" pcs":"—"],
                        ["Achievement",oee.ach?R(oee.ach)+"%":"—"],
                        ["Cycle Time (SMV)",oee.smv?oee.smv.toFixed(3)+" min":"—"],
                        ["Available Run Time",R(oee.art)+" min"],
                        ["Total NPT",R(oee.npt)+" min ("+P(oee.nptPct)+")"],
                        ["Actual Run Time",R(oee.runt)+" min"],
                        ["Good Production",Math.max(0,oee.good)+" pcs"],
                        ["Wastage %",P(oee.wastePct)],
                      ].map(([k,v])=>(
                        <tr key={k} style={{borderBottom:"1px solid #f2f4f7"}}>
                          <td style={{padding:"5px 2px",color:"#667085"}}>{k}</td>
                          <td style={{padding:"5px 2px",textAlign:"right",fontWeight:700,color:"#101828"}}>{v}</td>
                        </tr>
                      ))}
                    </table>
                    {!SMV[g.productCriteria]&&<div style={{fontSize:11,color:"#f79009",marginTop:8,padding:"6px 8px",background:"#fffaeb",borderRadius:6,border:"1px solid #fedf89"}}>⚠ SMV not in database — capacity fields will be blank in sheet.</div>}
                  </>
                )}
              </div>

              {/* Setup guide */}
              <div style={{background:"#f8f9fc",border:"1.5px solid #e4e7ec",borderRadius:12,padding:"14px 18px",fontSize:12,color:"#667085"}}>
                <div style={{fontWeight:700,marginBottom:8,color:"#344054",fontSize:13}}>⚙ Apps Script Setup</div>
                <ol style={{paddingLeft:18,lineHeight:2.1}}>
                  <li>Open your Google Sheet</li>
                  <li><b>Extensions → Apps Script</b> → paste <code style={{background:"#eaecf0",padding:"1px 5px",borderRadius:3}}>Code.gs</code></li>
                  <li>Set <code style={{background:"#eaecf0",padding:"1px 5px",borderRadius:3}}>PROD_HEADER_ROW</code> &amp; <code style={{background:"#eaecf0",padding:"1px 5px",borderRadius:3}}>BRKD_HEADER_ROW</code></li>
                  <li><b>Deploy → New deployment → Web App</b></li>
                  <li>Access: <b>Anyone</b> → copy URL → paste in this file at line 6</li>
                </ol>
              </div>
            </div>
          </div>
        )}

        {/* BREAKDOWN FORM */}
        {tab==="bd"&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,alignItems:"start"}}>
            <div style={{background:"#fff",border:"1.5px solid #e4e7ec",borderRadius:12,padding:"18px 20px"}}>
              <SecHead>Breakdown Entry</SecHead>
              <Field label="Date *"><Inp type="date" value={b.date} onChange={uB("date")}/></Field>
              <Field label="Section"><Inp value={b.section} readOnly onChange={()=>{}}/></Field>
              <Field label="Product Criteria *"><Sel value={b.productCriteria} onChange={uB("productCriteria")} options={PRODUCTS} placeholder="— Select product —"/></Field>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:4}}>
                <Field label="Machine No"><Sel value={b.machine} onChange={uB("machine")} options={MACHINES} placeholder="—"/></Field>
                <Field label="Supervisor *"><Sel value={b.supervisorName} onChange={uB("supervisorName")} options={SUPERVISORS} placeholder="—"/></Field>
              </div>
              <Field label="Shift *"><Sel value={b.shift} onChange={uB("shift")} options={SHIFTS} placeholder="— Select shift —"/></Field>
              <Field label="Breakdown Type *"><Sel value={b.breakdownType} onChange={uB("breakdownType")} options={BD_TYPES} placeholder="— Select type —"/></Field>
              <Field label="Breakdown Reason *"><Sel value={b.breakdownReason} onChange={uB("breakdownReason")} options={BD_REASONS} placeholder="— Select reason —"/></Field>
              <Field label="Downtime (Min) *"><Inp type="number" value={b.downtime} onChange={uB("downtime")} placeholder="0"/></Field>
              <Field label="Remarks"><Inp value={b.remarks} onChange={uB("remarks")} placeholder="Optional"/></Field>
              <button onClick={saveBd} disabled={loading} style={{...btnStyle,background:loading?"#84adcf":"#185FA5",color:"#fff",opacity:loading?0.8:1}}>
                {loading?"Saving…":"Save Breakdown Entry  →"}
              </button>
            </div>

            {/* Preview */}
            <div style={{background:"#fff",border:"1.5px solid #e4e7ec",borderRadius:12,padding:"18px 20px"}}>
              <SecHead>Entry Preview</SecHead>
              {[
                ["Date",b.date||"—"],
                ["Section",b.section],
                ["Product",b.productCriteria||"—"],
                ["Machine",b.machine||"—"],
                ["Supervisor",b.supervisorName||"—"],
                ["Shift",b.shift||"—"],
                ["Breakdown Type",b.breakdownType||"—"],
                ["Breakdown Reason",b.breakdownReason||"—"],
                ["Downtime",b.downtime?b.downtime+" min":"—"],
                ["Remarks",b.remarks||"—"],
                ["Month",b.date?monthLabel(b.date).split("-")[0]:"—"],
              ].map(([k,v])=>(
                <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"7px 0",borderBottom:"1px solid #f2f4f7",gap:8}}>
                  <span style={{color:"#667085",fontSize:12,flexShrink:0}}>{k}</span>
                  <span style={{fontWeight:600,fontSize:12,color:"#101828",textAlign:"right",wordBreak:"break-word",maxWidth:"60%"}}>{v}</span>
                </div>
              ))}
              <div style={{marginTop:16,padding:"10px 12px",background:"#f8f9fc",borderRadius:8,border:"1px solid #e4e7ec",fontSize:11,color:"#667085",lineHeight:1.7}}>
                💡 This entry will be appended to the <b>Injection Molding Breakdown</b> table in your Google Sheet.
              </div>
            </div>
          </div>
        )}

        <div style={{textAlign:"center",marginTop:20,fontSize:11,color:"#98a2b3"}}>
          ALEL Injection Molding OEE System · Built for Google Sheets integration
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
