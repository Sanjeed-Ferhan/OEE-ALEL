// ── Send data to Apps Script via a hidden form POST (bypasses CORS) ──────────
function postToSheet(payload) {
  return new Promise((resolve) => {
    const iframeId = "hidden_frame_" + Date.now();
    const formId   = "hidden_form_"  + Date.now();

    // Create hidden iframe as target
    const iframe = document.createElement("iframe");
    iframe.name = iframeId;
    iframe.id   = iframeId;
    iframe.style.cssText = "display:none;width:0;height:0;border:0;position:absolute;top:-9999px";
    document.body.appendChild(iframe);

    // Create hidden form
    const form = document.createElement("form");
    form.id     = formId;
    form.method = "POST";
    form.action = APPS_SCRIPT_URL;
    form.target = iframeId;
    form.style.cssText = "display:none;position:absolute;top:-9999px";

    // Embed JSON as a hidden field named "payload"
    const input = document.createElement("input");
    input.type  = "hidden";
    input.name  = "payload";
    input.value = JSON.stringify(payload);
    form.appendChild(input);

    document.body.appendChild(form);

    // Wait for iframe load = Apps Script responded
    let done = false;
    const timeout = setTimeout(() => {
      if (!done) {
        done = true;
        cleanup();
        // Timeout after 12s — treat as success since we can't read no-cors response
        // Apps Script usually saves fine even when CORS blocks the response read
        resolve({ success: true, timedOut: true });
      }
    }, 12000);

    iframe.onload = () => {
      if (!done) {
        done = true;
        clearTimeout(timeout);
        cleanup();
        resolve({ success: true });
      }
    };

    form.submit();

    function cleanup() {
      setTimeout(() => {
        if (document.getElementById(formId))   document.body.removeChild(form);
        if (document.getElementById(iframeId)) document.body.removeChild(iframe);
      }, 500);
    }
  });
}

function monthLabel(d) {
  if (!d) return "";
  const dt = new Date(d);
  return dt.toLocaleDateString("en-US", { month:"short", year:"numeric" }).replace(" ", "-");
}

function calcOEE(g, n) {
  const smv = SMV[g.productCriteria] || null;
  const st  = parseFloat(g.shiftTime) || 480;
  const pd  = parseFloat(n.plannedDown) || 0;
  const art = st - pd;
  const npt = (parseFloat(n.qco)||0)+(parseFloat(n.unavailOrder)||0)+(parseFloat(n.manpower)||0)+(parseFloat(n.gas)||0)+(parseFloat(n.electricity)||0)+(parseFloat(n.others)||0);
  const runt = art - npt;
  const ao   = parseFloat(g.actualOutput) || 0;
  const wst  = parseFloat(n.totalWastage) || 0;
  const good = ao - wst;
  const cap  = smv ? Math.round(st / smv * 10) / 10 : null;
  const tgt  = pd > 0 && smv ? Math.round((st - pd) / smv * 10) / 10 : cap;
  const av   = art > 0 ? runt / art : 0;
  const perf = runt > 0 && smv ? ao * smv / runt : 0;
  const qual = ao  > 0 ? good / ao : 0;
  return { cap, tgt, smv, ach: tgt ? ao/tgt*100 : null, art, runt, npt, nptPct: art>0?npt/art:0, av, perf, qual, oee: av*perf*qual, good, wastePct: ao>0?wst/ao:0 };
}

                ))}
              </div>
              <F l="Wastage Reason"><Inp v={n.wastageReason} on={uN("wastageReason")} ph="e.g. bad mold"/></F>
              <F l="Remarks"><Inp v={n.remarks} on={uN("remarks")} ph="Optional"/></F>

              <button onClick={saveProd} disabled={loading}
                style={{...BTN, background:loading?"#84adcf":"#185FA5", color:"#fff", opacity:loading?0.8:1}}>
                {loading ? "⏳ Saving to Google Sheet…" : "Save Production Entry  →"}
              </button>
            </div>

            {/* OEE Preview + Guide */}
            <div>
              <div style={{background:"#fff", border:"1.5px solid #e4e7ec", borderRadius:12, padding:"18px 20px", marginBottom:14}}>
                <div style={SH}>Live OEE Preview</div>
                {!oee ? (
                  <div style={{textAlign:"center", padding:"28px 0", color:"#98a2b3", fontSize:13}}>
                    <div style={{fontSize:32, marginBottom:8}}>📊</div>
                    Select a product and enter<br/>actual output to see OEE live.
                  </div>
                ) : (
                  <>
                    <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:14}}>
                      {[["Availability",P(oee.av),false],["Performance",P(oee.perf),false],["Quality",P(oee.qual),false],["OEE",P(oee.oee),true]].map(([l,v,a])=>(
                        <div key={l} style={{background:a?"#e8f1fb":"#f9fafb", border:"1.5px solid #e4e7ec", borderRadius:8, padding:"10px 12px", textAlign:"center"}}>
                          <div style={{fontSize:10, fontWeight:700, color:"#98a2b3", textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:3}}>{l}</div>
                          <div style={{fontSize:22, fontWeight:700, color:a?"#185FA5":"#101828"}}>{v}</div>
                        </div>
                      ))}
                    </div>
                    <table style={{width:"100%", fontSize:12, borderCollapse:"collapse"}}>
                      {[
                        ["Shift Capacity", oee.cap?R(oee.cap)+" pcs":"—"],
                        ["Shift Target",   oee.tgt?R(oee.tgt)+" pcs":"—"],
                        ["Achievement",    oee.ach?R(oee.ach)+"%":"—"],
                        ["SMV (Cycle Time)",oee.smv?oee.smv.toFixed(3)+" min":"—"],
                        ["Available Run",  R(oee.art)+" min"],
                        ["Total NPT",      R(oee.npt)+" min ("+P(oee.nptPct)+")"],
                        ["Actual Run",     R(oee.runt)+" min"],
                        ["Good Production",Math.max(0,oee.good)+" pcs"],
                        ["Wastage %",      P(oee.wastePct)],
                      ].map(([k,v])=>(
                        <tr key={k} style={{borderBottom:"1px solid #f2f4f7"}}>
                          <td style={{padding:"5px 2px", color:"#667085"}}>{k}</td>
                          <td style={{padding:"5px 2px", textAlign:"right", fontWeight:700, color:"#101828"}}>{v}</td>
                        </tr>
                      ))}
                    </table>
                    {!SMV[g.productCriteria] && (
                      <div style={{marginTop:8, padding:"6px 10px", background:"#fffaeb", border:"1px solid #fedf89", borderRadius:6, fontSize:11, color:"#b54708"}}>
                        ⚠ SMV not in database — capacity fields will be blank.
                      </div>
                    )}
                  </>
                )}
              </div>

              <div style={{background:"#f8f9fc", border:"1.5px solid #e4e7ec", borderRadius:12, padding:"14px 18px", fontSize:12, color:"#667085"}}>
                <div style={{fontWeight:700, marginBottom:8, color:"#344054", fontSize:13}}>⚙ Apps Script Setup</div>
                <ol style={{paddingLeft:18, lineHeight:2.1}}>
                  <li>Open your Google Sheet</li>
                  <li><b>Extensions → Apps Script</b> → paste <code style={{background:"#eaecf0",padding:"1px 5px",borderRadius:3}}>Code.gs</code></li>
                  <li><b>Deploy → New deployment → Web App</b></li>
                  <li>Execute as: <b>Me</b> · Access: <b>Anyone</b></li>
                  <li>Copy URL → replace line 6 of this file</li>
                  <li>Re-upload <code style={{background:"#eaecf0",padding:"1px 5px",borderRadius:3}}>index.html</code> to GitHub</li>
                </ol>
              </div>
            </div>
          </div>
        )}

        {/* ── BREAKDOWN TAB ── */}
        {tab==="bd" && (
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, alignItems:"start"}}>
            <div style={{background:"#fff", border:"1.5px solid #e4e7ec", borderRadius:12, padding:"18px 20px"}}>
              <div style={SH}>Breakdown Entry</div>
              <F l="Date *"><Inp type="date" v={b.date} on={uB("date")}/></F>
              <F l="Section"><Inp v={b.section} on={()=>{}} ro/></F>
              <F l="Product Criteria *"><Sel v={b.productCriteria} on={uB("productCriteria")} opts={PRODUCTS} ph="— Select product —"/></F>
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:4}}>
                <F l="Machine No"><Sel v={b.machine} on={uB("machine")} opts={MACHINES} ph="—"/></F>
                <F l="Supervisor *"><Sel v={b.supervisorName} on={uB("supervisorName")} opts={SUPERVISORS} ph="—"/></F>
              </div>
              <F l="Shift *"><Sel v={b.shift} on={uB("shift")} opts={SHIFTS} ph="— Select —"/></F>
              <F l="Breakdown Type *"><Sel v={b.breakdownType} on={uB("breakdownType")} opts={BD_TYPES} ph="— Select type —"/></F>
              <F l="Breakdown Reason *"><Sel v={b.breakdownReason} on={uB("breakdownReason")} opts={BD_REASONS} ph="— Select reason —"/></F>
              <F l="Downtime (Min) *"><Inp type="number" v={b.downtime} on={uB("downtime")} ph="0"/></F>
              <F l="Remarks"><Inp v={b.remarks} on={uB("remarks")} ph="Optional"/></F>
              <button onClick={saveBd} disabled={loading}
                style={{...BTN, background:loading?"#84adcf":"#185FA5", color:"#fff", opacity:loading?0.8:1}}>
                {loading ? "⏳ Saving to Google Sheet…" : "Save Breakdown Entry  →"}
              </button>
            </div>

            <div style={{background:"#fff", border:"1.5px solid #e4e7ec", borderRadius:12, padding:"18px 20px"}}>
              <div style={SH}>Entry Preview</div>
              {[
                ["Date",            b.date||"—"],
                ["Section",         b.section],
                ["Product",         b.productCriteria||"—"],
                ["Machine",         b.machine||"—"],
                ["Supervisor",      b.supervisorName||"—"],
                ["Shift",           b.shift||"—"],
                ["Breakdown Type",  b.breakdownType||"—"],
                ["Reason",          b.breakdownReason||"—"],
                ["Downtime",        b.downtime?b.downtime+" min":"—"],
                ["Remarks",         b.remarks||"—"],
                ["Month",           b.date?monthLabel(b.date).split("-")[0]:"—"],
              ].map(([k,v])=>(
                <div key={k} style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", padding:"6px 0", borderBottom:"1px solid #f2f4f7", gap:8}}>
                  <span style={{color:"#667085", fontSize:12, flexShrink:0}}>{k}</span>
                  <span style={{fontWeight:600, fontSize:12, color:"#101828", textAlign:"right", wordBreak:"break-word", maxWidth:"60%"}}>{v}</span>
                </div>
              ))}
              <div style={{marginTop:14, padding:"10px 12px", background:"#f0f9ff", border:"1px solid #bae6fd", borderRadius:8, fontSize:11, color:"#0369a1", lineHeight:1.7}}>
                💡 This entry will be appended to the <b>Injection Molding Breakdown</b> sheet.
              </div>
            </div>
          </div>
        )}

        <div style={{textAlign:"center", marginTop:18, fontSize:11, color:"#98a2b3"}}>
          ALEL Injection Molding OEE System · Google Sheets Integration
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
